<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>Vero · Private brochure</title>
<link rel="preload" href="/assets/fustat-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Fustat;font-weight:300;src:url(/assets/fustat-300.woff2) format('woff2')}
@font-face{font-family:Fustat;font-weight:400;src:url(/assets/fustat-400.woff2) format('woff2')}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Fustat,-apple-system,'Segoe UI',Arial,sans-serif;color:#111;background:#fff;max-width:560px;margin:0 auto;padding-bottom:96px}
.k{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:#8a8a8a}
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) 22px 12px}
.logo{height:17px;display:block}
.hero{height:min(60vw,300px);background:#eee center/cover}
.pad{padding:20px 22px 0}
.t1{font-size:23px;line-height:1.22;margin:8px 0 6px;font-weight:400}
.bld{font-size:13px;color:#6b6b6b}
.short{width:34px;height:1px;background:#cfcfcc;margin:14px 0}
.price{font-size:34px;font-weight:300;margin:4px 0 0;letter-spacing:-.01em}
.price small{font-size:14px;color:#8a8a8a;margin-left:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #e3e3e0;margin-top:16px}
.grid div{padding:11px 0;border-bottom:1px solid #e3e3e0}.grid div:nth-child(odd){padding-right:12px}
.grid b{display:block;font-weight:400;font-size:16px;margin-top:4px}
.sec{padding:30px 22px 0}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sh h2{font-weight:400;font-size:21px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.gal img{width:100%;height:150px;object-fit:cover;display:block;cursor:zoom-in;background:#eee}
.gal img.w{grid-column:1/-1;height:min(64vw,300px)}
.more{display:block;width:100%;margin-top:10px;height:44px;border:1px solid #d6d6d3;border-radius:22px;background:#fff;font:inherit;font-size:13px;letter-spacing:.04em;color:#111}
.p{font-size:14px;line-height:1.65;color:#3a3a3a;white-space:pre-line}
.p.clip{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.rm{font-size:13px;color:#111;text-decoration:underline;margin-top:8px;display:inline-block;background:none;border:0;font-family:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.chips span{font-size:12.5px;border:1px solid #e1e1de;border-radius:14px;padding:5px 10px}
.hair{height:1px;background:#e3e3e0;margin:24px 0 0}
.fp img{width:100%;display:block;margin-top:8px}
.dark{background:#111214;color:#fff;margin-top:34px;padding:52px 24px 40px}
.dark .k{color:#8d9096}
.big{font-size:32px;line-height:1.12;font-weight:400;margin:14px 0 10px;letter-spacing:-.01em}
.sub{font-size:13px;color:#a2a5aa;line-height:1.5}
.ag{display:flex;gap:14px;align-items:center;margin-top:30px}
.ag img{width:86px;height:86px;object-fit:cover;border-radius:3px}
.ag b{font-weight:400;font-size:19px;display:block}.ag small{font-size:12px;color:#a2a5aa}
.ct{margin-top:22px;border-top:1px solid #2a2c30;padding-top:16px;display:grid;gap:14px}
.ct a{color:#fff;text-decoration:none;font-size:15px}.ct .k{display:block;margin-bottom:4px}
.db{display:flex;align-items:center;justify-content:center;height:50px;border-radius:25px;font-size:13px;letter-spacing:.08em;margin-top:10px;text-decoration:none}
.w{background:#fff;color:#111}.o{border:1px solid #3a3d42;color:#fff}
.disc{display:flex;justify-content:space-between;gap:12px;margin-top:34px;font-size:9.5px;color:#6f7378}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 18px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(180deg,rgba(255,255,255,0),#fff 30%);display:flex;gap:10px;max-width:560px;margin:0 auto}
.btn{flex:1;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:13px;letter-spacing:.06em;text-decoration:none}
.bk{background:#111;color:#fff}.bw{border:1px solid #d6d6d3;background:#fff;color:#111}
.lb{position:fixed;inset:0;background:#000;z-index:20;display:none}
.lb.on{display:block}.lb .s{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory}
.lb .s img{flex:0 0 100%;width:100%;height:100%;object-fit:contain;scroll-snap-align:center}
.lb .x{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:14px;width:38px;height:38px;border-radius:19px;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:20px}
.lb .n{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 18px);left:0;right:0;text-align:center;color:#fff;font-size:12px;letter-spacing:.15em}
@media print{.bar,.lb,.top{display:none!important}body{padding:0;max-width:none}.dark{-webkit-print-color-adjust:exact;print-color-adjust:exact}.p.clip{display:block}.rm{display:none}}

.ld{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;z-index:30;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#8a8a8a}
.err{padding:120px 24px;text-align:center;font-size:14px;color:#6b6b6b}
</style></head><body>
<div class="ld" id="ld">Loading Vero brochure…</div>
<div id="app"></div>
<script>
/* Vero brochure · iPhone layout (Claude, 25 Nov 2026). Same design as the CRM brochure (claude_brochure.py).
   /brochure?url=<Property Finder link>&for=<Client name>   Data: /api/scrape (unchanged). */
(function(){
var AG={name:'Hamed Taheri',title:'Senior Private Client Advisor',co:'Vero',phone:'+971 58 517 1746',wa:'971585171746',email:'hamed@verouae.com',web:'verouae.com'};
var q=new URLSearchParams(location.search),url=q.get('url')||'',who=(q.get('for')||'').trim();
function e(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){var n=parseFloat(String(v==null?'':v).replace(/[^0-9.]/g,''));return isFinite(n)?n:0}
function aed(v){var n=num(v);if(!n)return '';if(n>=1e6)return 'AED '+(n/1e6).toFixed(2).replace(/\.?0+$/,'')+'M';if(n>=1e3)return 'AED '+(n/1e3).toFixed(1).replace(/\.0$/,'')+'K';return 'AED '+n}
function neutral(d){return String(d||'').replace(/^\s*[A-Z][\w&'. -]{1,40}?\s+(?:is|are)\s+(?:proud|pleased|delighted)\s+to\s+(?:present|offer)/,'Vero is pleased to present')}
var app=document.getElementById('app'),ld=document.getElementById('ld');
if(!url){ld.remove();app.innerHTML='<div class="err">Add a Property Finder link: /brochure?url=…</div>';return}
fetch('/api/scrape?url='+encodeURIComponent(url)).then(function(r){return r.json()}).then(function(j){
  if(!j||!(j.price||(j.photos||[]).length))throw new Error('This advert could not be read (it may have been removed).');
  var rent=/\/rent\//i.test(url)||/year/i.test(j.price||'');
  var title=String(j.marketingTitle||j.title||j.building||'Private residence').replace(/\s*\|\s*/g,' | ').replace(/^[ |]+|[ |]+$/g,'');
  var parts=[],seen={};[j.building,j.area||j.community].forEach(function(x){if(x&&x!==title&&!seen[x.toLowerCase()]){seen[x.toLowerCase()]=1;parts.push(x)}});
  var ph=(j.photos||[]).filter(Boolean).slice(0,24),price=aed(j.price),beds=String(j.beds||'');
  var bedTxt=/^(0|studio)$/i.test(beds.trim())?'Studio':(beds||'—');
  var specs=[['Beds',bedTxt],['Baths',j.baths||'—'],['Size',num(j.size)?num(j.size).toLocaleString('en-US')+' sqft':'—'],['Type',j.propertyType||'Apartment']];
  var bld=j.building&&title.indexOf(j.building)<0?' in '+j.building:'';
  var viewTxt='Hi Hamed, I would like to arrange a viewing for '+title+bld,askTxt='Hi Hamed, I have a question about '+title+bld;
  var wa=function(t){return 'https://wa.me/'+AG.wa+'?text='+encodeURIComponent(t+(who?' ('+who+')':''))};
  var gal=ph.slice(1,9).map(function(u,k){var i=k+1;return '<img '+(k===0?'class="w" ':'')+'src="'+e(u)+'" alt="Photo '+(i+1)+'" data-i="'+i+'" loading="'+(k<3?'eager':'lazy')+'">'}).join('');
  if(ph.length===1)gal='<img class="w" src="'+e(ph[0])+'" alt="Photo 1" data-i="0">';
  var feats=(j.features||[]).filter(Boolean).slice(0,16).map(function(f){return '<span>'+e(f)+'</span>'}).join('');
  var desc=neutral(j.description||'').trim();
  var h='<div class="top"><img class="logo" src="/assets/vero-logo-dark.png" alt="Vero"><span class="k">Private brochure</span></div>'+
   '<div class="hero" role="img" aria-label="Main photo" style="background-image:url(\''+e(ph[0]||'')+'\')" data-i="0"></div>'+
   '<div class="pad"><div class="k">'+(rent?'For rent':'For sale')+(who?' · Prepared for '+e(who):'')+'</div><h1 class="t1">'+e(title)+'</h1><div class="bld">'+e(parts.join(' · '))+'</div><div class="short"></div>'+
   '<div class="k">'+(rent?'Asking rent':'Asking price')+'</div><div class="price">'+e(price||'Price on request')+(rent&&price?'<small>/ year</small>':'')+'</div>'+
   '<div class="grid">'+specs.map(function(s){return '<div><span class="k">'+e(s[0])+'</span><b>'+e(s[1])+'</b></div>'}).join('')+'</div></div>';
  if(ph.length)h+='<div class="sec"><div class="sh"><h2>The residence</h2><span class="k">'+ph.length+' photos</span></div><div class="gal">'+gal+'</div>'+(ph.length>1?'<button class="more" id="more">View all '+ph.length+' photos</button>':'')+'</div>';
  if(desc||feats)h+='<div class="sec"><div class="k">About this home</div>'+(desc?'<p class="p clip" id="desc" style="margin-top:10px">'+e(desc)+'</p><button class="rm" id="rm">Read more</button>':'')+(feats?'<div class="chips">'+feats+'</div>':'')+'</div>';
  if(j.floorplan)h+='<div class="sec fp"><div class="k">Floor plan</div><img src="'+e(j.floorplan)+'" alt="Floor plan"></div>';
  h+='<div class="dark"><div style="display:flex;justify-content:space-between;align-items:center"><img class="logo" src="/assets/vero-logo-light.png" alt="Vero"><span class="k">Arrange a private viewing</span></div>'+
   '<div class="big" style="margin-top:56px">Speak with your agent.</div><div class="sub">We\'d be delighted to arrange a private viewing at a time that suits you.</div>'+
   '<div class="ag"><img src="/assets/hamed-taheri-portrait.jpg" alt=""><div><b>'+AG.name+'</b><small>'+AG.title+' · '+AG.co+'</small></div></div>'+
   '<div class="ct"><div><span class="k">Mobile</span><a href="tel:'+AG.phone.replace(/ /g,'')+'">'+AG.phone+'</a></div><div><span class="k">Email</span><a href="mailto:'+AG.email+'">'+AG.email+'</a></div></div>'+
   '<div style="margin-top:22px"><a class="db w" href="'+e(wa(askTxt))+'">WhatsApp Hamed</a><a class="db o" href="'+e(wa(viewTxt))+'">Book a private viewing</a><a class="db o" id="pdf" href="#">Save as PDF</a></div>'+
   '<div class="disc"><span>All information is believed accurate but is provided without warranty.'+(j.ref?' Ref '+e(j.ref):'')+'</span><span>'+AG.web+'</span></div></div>'+
   '<div class="bar"><a class="btn bw" href="#" id="sp">See photos</a><a class="btn bk" href="'+e(wa(viewTxt))+'">Book a viewing</a></div>'+
   '<div class="lb" id="lb"><div class="s">'+ph.map(function(u){return '<img src="'+e(u)+'" alt="" loading="lazy">'}).join('')+'</div><button class="x" aria-label="Close">×</button><div class="n"></div></div>';
  app.innerHTML=h;document.title=(j.building||title)+' · '+(price||'Vero')+(who?' · '+who:'');ld.remove();
  var L=document.getElementById('lb'),S=L.querySelector('.s'),N=L.querySelector('.n'),T=S.children.length;
  function cnt(){N.textContent=(Math.round(S.scrollLeft/S.clientWidth)+1)+' / '+T}
  function open(i){L.classList.add('on');S.scrollLeft=i*S.clientWidth;cnt()}
  S.addEventListener('scroll',cnt,{passive:true});L.querySelector('.x').onclick=function(){L.classList.remove('on')};
  [].forEach.call(document.querySelectorAll('[data-i]'),function(im){im.onclick=function(){open(+im.dataset.i)}});
  var m=document.getElementById('more');if(m)m.onclick=function(){open(0)};
  var r=document.getElementById('rm'),p=document.getElementById('desc');if(r&&p){if(p.scrollHeight<=p.clientHeight+4)r.style.display='none';r.onclick=function(){p.classList.remove('clip');r.style.display='none'}}
  document.getElementById('pdf').onclick=function(ev){ev.preventDefault();window.print()};
  document.getElementById('sp').onclick=function(ev){ev.preventDefault();var s=document.querySelector('.sec');if(s)s.scrollIntoView({behavior:'smooth'})};
}).catch(function(err){ld.remove();app.innerHTML='<div class="top"><img class="logo" src="/assets/vero-logo-dark.png" alt="Vero"></div><div class="err">'+e(err.message||err)+'<br><br><a href="'+e(url)+'">Open the advert</a></div>'})})();
</script></body></html>
